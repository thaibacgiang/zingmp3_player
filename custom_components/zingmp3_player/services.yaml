search:
  name: Search
  description: Search for music on Zing MP3.
  target:
    entity:
      integration: zingmp3_player
      domain: media_player
  fields:
    query:
      name: Query
      description: Search query string.
      required: true
      example: "Sơn Tùng M-TP"
      selector:
        text:
    filter:
      name: Filter
      description: Type of content to search for.
      required: false
      default: "songs"
      selector:
        select:
          options:
            - "songs"
            - "playlists"
    limit:
      name: Limit
      description: Maximum number of results.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: slider

call_method:
  name: Call Method
  description: Call a custom method on the media player.
  target:
    entity:
      integration: zingmp3_player
      domain: media_player
  fields:
    command:
      name: Command
      description: The command to execute.
      required: true
      example: "goto_track"
      selector:
        text:
    parameters:
      name: Parameters
      description: Parameters for the command.
      required: false
      example: '{"track_no": 5}'
      selector:
        object:
